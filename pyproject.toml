[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "MCP server for managing Google Ads UAC iOS campaigns"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-ads>=24.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "openai>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:main"
